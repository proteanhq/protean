# The mirrored service images (Elasticsearch, Redis, Postgres, Message-DB,
# MSSQL, MySQL, MariaDB) can each be overridden to pull from this org's GHCR mirror instead of
# upstream (see docs/community/contributing/testing.md for the exact mirror refs
# — the mirror carries CI's tag set, which differs from the defaults below).
# The defaults keep local `make up` on upstream registries, so no auth or mirror
# access is required for day-to-day development. Kibana is not mirrored.
services:
  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-elasticsearch:8.7.0}
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - 59200:9200

  kibana:
    image: kibana:8.7.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - 55601:5601
    depends_on:
      - elasticsearch

  redis:
    image: ${REDIS_IMAGE:-redis:7.0.11}
    ports:
      - "56379:6379"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15.2}
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "max_connections=100"]

  message-db:
    image: ${MESSAGE_DB_IMAGE:-ethangarofolo/message-db:1.3.1}
    ports:
      - "0.0.0.0:55433:5432"

  mssql:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    ports:
      - "51433:1433"
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: "Protean123!"
      MSSQL_PID: "Developer"

  # One provider (`mysql`) serves both servers, and SQLAlchemy reports a
  # different dialect name for each, so both run in the test matrix.
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    ports:
      - "53306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: protean
      MYSQL_DATABASE: protean

  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    ports:
      - "53307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: protean
      MARIADB_DATABASE: protean

volumes:
  elasticsearch-data:
    driver: local
