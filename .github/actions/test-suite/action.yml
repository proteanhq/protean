# Shared test-suite runner used by both the per-PR CI (ci.yml) and the nightly
# full-matrix run (nightly.yml). It is a composite action rather than a reusable
# `workflow_call` on purpose: a called workflow prefixes its status-check name
# with the caller job (`caller / job (matrix)`), which would break the exact
# branch-protection contexts (`Python 3.14 Tests`, `Python 3.14 Full`). A
# composite action keeps the job in the caller, so the caller owns the name.
#
# The caller must `actions/checkout` before invoking this action.
name: "Protean test suite"
description: "Install and run the Protean test suite (CORE, FULL or a PR-lane leg) at the chosen resolution."

inputs:
  python-version:
    description: "Python version to test against."
    required: true
  full:
    description: "'true' runs the FULL adapter suite (`-c FULL`) against Docker service containers; 'false' runs the fast in-memory CORE suite."
    required: false
    default: "false"
  resolution:
    description: "'highest' uses the locked latest-compatible versions; 'lowest-direct' re-resolves declared dependencies to their floor."
    required: false
    default: "highest"
  enforce-coverage:
    description: "'true' fails the run if coverage drops below the project floor. Only meaningful for a FULL leg."
    required: false
    default: "false"
  upload-coverage:
    description: "'true' uploads coverage to Codecov. Only meaningful for a FULL leg."
    required: false
    default: "false"
  codecov-token:
    description: "Codecov upload token (required only when upload-coverage is 'true')."
    required: false
    default: ""
  services:
    description: "Space-separated service containers to start for a non-FULL leg (names as in tests/adapters.toml). A FULL leg starts all of them."
    required: false
    default: ""
  test-args:
    description: "Arguments for `protean test`, replacing the CORE or `-c FULL` default. The PR lane passes `-c PR ...`."
    required: false
    default: ""
  coverage-artifact:
    description: "When set, save the leg's coverage data as an artifact of this name, for ci.yml's `Coverage` job to combine."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # Service setup (this step through "Wait for services") runs only for a leg
    # that needs containers: a FULL leg starts all of them, and an adapter leg
    # (ci.yml's `Adapters` job) starts the ones its adapters list in
    # tests/adapters.toml. CORE legs need no Docker. Images are pulled from this
    # org's public GHCR mirror (populated by mirror-images.yml), not Docker Hub,
    # so there is no login step and fork PRs pull them with zero secrets.
    - name: Choose services
      id: services
      shell: bash
      run: |
        if [ "${{ inputs.full }}" == "true" ]; then
          list="postgres redis message-db mssql mysql mariadb elasticsearch"
        else
          list="${{ inputs.services }}"
        fi
        echo "list=$list" >> "$GITHUB_OUTPUT"

    # Only a FULL leg caches images: it pulls every service image. An adapter
    # leg pulls one or two, which is quicker than loading a cache of them all.
    - name: Cache Docker images
      id: docker-cache
      if: inputs.full == 'true'
      uses: actions/cache@v6
      with:
        path: /tmp/docker-images
        # Bump when the image list below changes: a hit on an older key skips
        # the pull step entirely, so a newly added image would be missing from
        # the cache and pulled one container at a time instead.
        key: docker-images-${{ runner.os }}-v4

    - name: Load or pull Docker images
      if: steps.services.outputs.list != ''
      shell: bash
      run: |
        image() {
          case "$1" in
            postgres) echo "ghcr.io/proteanhq/mirror/postgres:16" ;;
            redis) echo "ghcr.io/proteanhq/mirror/redis:7" ;;
            elasticsearch) echo "ghcr.io/proteanhq/mirror/elasticsearch:8.7.0" ;;
            message-db) echo "ghcr.io/proteanhq/mirror/message-db:1.2.6" ;;
            mssql) echo "ghcr.io/proteanhq/mirror/mssql-server:2022-latest" ;;
            # MySQL and MariaDB come from Docker Hub until the mirror carries
            # them. mirror-images.yml lists them, but that workflow is
            # dispatch-only and its new packages have to be made Public by hand
            # before CI can pull them. Move these two to
            # ghcr.io/proteanhq/mirror/ once that is done.
            mysql) echo "mysql:8.4" ;;
            mariadb) echo "mariadb:11.4" ;;
            *) echo "Unknown service: $1" >&2; exit 1 ;;
          esac
        }
        IMAGES=()
        for svc in ${{ steps.services.outputs.list }}; do
          IMAGES+=("$(image "$svc")")
        done

        # A cache-hit with no tarballs (e.g. a cache saved by an interrupted
        # run) would otherwise iterate the literal glob and fail `docker load`;
        # nullglob makes the array empty and we fall through to pulling.
        shopt -s nullglob
        cached_tarballs=(/tmp/docker-images/*.tar)

        if [ "${{ steps.docker-cache.outputs.cache-hit }}" == "true" ] && [ ${#cached_tarballs[@]} -gt 0 ]; then
          echo "Loading cached Docker images..."
          for f in "${cached_tarballs[@]}"; do
            docker load -i "$f" &
          done
          wait
        else
          echo "Pulling Docker images..."
          for img in "${IMAGES[@]}"; do
            docker pull "$img" &
          done
          wait

          if [ "${{ inputs.full }}" == "true" ]; then
            echo "Saving Docker images to cache..."
            mkdir -p /tmp/docker-images
            for img in "${IMAGES[@]}"; do
              name=$(echo "$img" | tr '/:' '_')
              docker save "$img" -o "/tmp/docker-images/${name}.tar" &
            done
            wait
          fi
        fi

    - name: Configure sysctl limits
      if: steps.services.outputs.list != ''
      shell: bash
      run: |
        sudo swapoff -a
        sudo sysctl -w vm.swappiness=1
        sudo sysctl -w fs.file-max=262144
        sudo sysctl -w vm.max_map_count=262144

    - name: Start service containers
      if: steps.services.outputs.list != ''
      shell: bash
      run: |
        # Free the host ports below before binding them. Remove ALL containers
        # left over from a previous run on this (potentially reused) runner:
        # matching only our own names misses a container leaked under a
        # different name, or one still shutting down, either of which can keep
        # a port bound (e.g. the 59300 Elasticsearch transport port) and fail
        # `docker run` with "address already in use".
        leaked=$(docker ps -aq)
        if [ -n "$leaked" ]; then
          docker rm -f $leaked
        fi

        # Removing the containers is not enough on its own. `docker rm -f`
        # returns once the container is signalled, but dockerd's userland proxy
        # keeps the published port bound until it exits, so the next
        # `docker run` can still lose the race. Cutting 0.17.0 this failed on
        # 59200 ("failed to bind host port for 0.0.0.0:59200: address already
        # in use") with every container already removed. Wait for the ports
        # themselves.
        for port in 55432 56379 55433 51433 53306 53307 59200 59300; do
          for _ in $(seq 1 30); do
            ss -ltnH "sport = :$port" 2>/dev/null | grep -q . || break
            sleep 1
          done
        done

        for svc in ${{ steps.services.outputs.list }}; do
          case "$svc" in
            postgres)
              docker run -d --name postgres \
                -p 55432:5432 \
                -e POSTGRES_PASSWORD=postgres \
                ghcr.io/proteanhq/mirror/postgres:16 ;;
            redis)
              docker run -d --name redis \
                -p 56379:6379 \
                ghcr.io/proteanhq/mirror/redis:7 ;;
            message-db)
              docker run -d --name message-db \
                -p 55433:5432 \
                ghcr.io/proteanhq/mirror/message-db:1.2.6 ;;
            mssql)
              docker run -d --name mssql \
                -p 51433:1433 \
                -e ACCEPT_EULA=Y \
                -e "SA_PASSWORD=Protean123!" \
                ghcr.io/proteanhq/mirror/mssql-server:2022-latest ;;
            mysql)
              docker run -d --name mysql \
                -p 53306:3306 \
                -e MYSQL_ROOT_PASSWORD=protean \
                -e MYSQL_DATABASE=protean \
                mysql:8.4 ;;
            mariadb)
              docker run -d --name mariadb \
                -p 53307:3306 \
                -e MARIADB_ROOT_PASSWORD=protean \
                -e MARIADB_DATABASE=protean \
                mariadb:11.4 ;;
            elasticsearch)
              docker run -d --name elasticsearch \
                -p 59200:9200 \
                -p 59300:9300 \
                -e "discovery.type=single-node" \
                -e "xpack.security.enabled=false" \
                -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" \
                ghcr.io/proteanhq/mirror/elasticsearch:8.7.0 ;;
          esac
        done

    - name: Wait for services
      if: steps.services.outputs.list != ''
      shell: bash
      run: |
        for svc in ${{ steps.services.outputs.list }}; do
          echo "Waiting for $svc..."
          case "$svc" in
            postgres)
              timeout 60 bash -c 'until docker exec postgres pg_isready -U postgres 2>/dev/null; do sleep 2; done' ;;
            redis)
              timeout 30 bash -c 'until docker exec redis redis-cli ping 2>/dev/null; do sleep 2; done' ;;
            message-db)
              timeout 60 bash -c 'until docker exec message-db pg_isready -U postgres 2>/dev/null; do sleep 2; done' ;;
            mssql)
              timeout 60 bash -c 'until docker exec mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Protean123!" -Q "SELECT 1" -b -C 2>/dev/null; do sleep 2; done' ;;
            # `mysqladmin ping` answers before the server finishes its first-run
            # initialisation, so also wait for a real query to succeed.
            mysql)
              timeout 120 bash -c 'until docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -pprotean --silent 2>/dev/null; do sleep 2; done'
              timeout 60 bash -c 'until docker exec mysql mysql -h 127.0.0.1 -uroot -pprotean -e "SELECT 1" protean 2>/dev/null; do sleep 2; done' ;;
            mariadb)
              timeout 120 bash -c 'until docker exec mariadb mariadb-admin ping -h 127.0.0.1 -uroot -pprotean --silent 2>/dev/null; do sleep 2; done'
              timeout 60 bash -c 'until docker exec mariadb mariadb -h 127.0.0.1 -uroot -pprotean -e "SELECT 1" protean 2>/dev/null; do sleep 2; done' ;;
            elasticsearch)
              timeout 120 bash -c 'until curl -s http://localhost:59200/_cluster/health | grep -q "yellow\|green"; do sleep 2; done' ;;
          esac
          echo "$svc is ready!"
        done
        echo "All services are ready!"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        # Only the prerelease line needs this, so "3.15" resolves to its newest
        # rc/beta. setup-python already keeps a GA line like "3.14" on its stable
        # release (it considers prereleases only when no GA version matches), so
        # scoping this to 3.15 changes nothing for the stable legs and keeps
        # prerelease resolution off them entirely. Widen when a newer prerelease
        # becomes the target.
        allow-prereleases: ${{ inputs.python-version == '3.15' }}

    - name: Install Microsoft ODBC Driver 18 and tools
      if: contains(steps.services.outputs.list, 'mssql')
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y curl gnupg apt-transport-https
        curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc >/dev/null
        # Match the runner's Ubuntu release so this keeps working when
        # `ubuntu-latest` advances; fall back to 24.04 (the last release we know
        # Microsoft publishes a feed for) if the current release has none yet.
        ubuntu_ver="$(. /etc/os-release && echo "${VERSION_ID}")"
        if ! curl -fsSL "https://packages.microsoft.com/config/ubuntu/${ubuntu_ver}/prod.list" -o /tmp/mssql-prod.list; then
          echo "No Microsoft feed for Ubuntu ${ubuntu_ver}; falling back to 24.04."
          curl -fsSL "https://packages.microsoft.com/config/ubuntu/24.04/prod.list" -o /tmp/mssql-prod.list
        fi
        sudo cp /tmp/mssql-prod.list /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18 unixodbc-dev
        echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

    - name: Install unixODBC headers (prerelease CORE leg)
      # The mssql extra pulls pyodbc, which has no cp315 wheel yet, so the 3.15
      # CORE sync builds it from source and that build needs the unixODBC headers
      # (sql.h). A leg that starts MSSQL already gets them from the driver step
      # above, and the stable Pythons pull a prebuilt pyodbc wheel and never
      # compile it, so this is only needed on a 3.15 leg without MSSQL. Widen the
      # version check when a newer prerelease lands, or drop it once pyodbc ships
      # a cp315 wheel.
      if: "!contains(steps.services.outputs.list, 'mssql') && inputs.python-version == '3.15'"
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y unixodbc-dev

    - name: Install dependencies
      # A lowest-direct leg re-resolves declared deps to their floor (installing
      # all extras so a floor without a wheel for the newest Python fails here);
      # every other leg uses the locked latest-compatible resolution.
      #
      # The `mutation` group is excluded on purpose: it pulls `mutmut` and its
      # `libcst` (a PyO3 extension whose pinned pyo3 caps at 3.14 and won't build
      # on a newer prerelease like 3.15). Nothing in the test suite imports it;
      # `make mutation` builds its own env. Keeping it here would break the newest
      # leg and only slow the others down.
      shell: bash
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: ${{ (inputs.python-version == '3.13' || inputs.python-version == '3.14') && '1' || '' }}
      run: uv sync --all-extras --all-groups --no-group mutation ${{ inputs.resolution == 'lowest-direct' && '--resolution lowest-direct' || '' }}

    - name: Tests
      # FULL runs the adapter suite against the service containers, in one
      # process. CORE and floors run the fast in-memory suite, spread over the
      # runner's CPUs with pytest-xdist (the POSTGRES/etc. env below is simply
      # unused there). Both runs include tests/ext, the mypy plugin tests.
      # `test-args` replaces both, for the PR lane (`-c PR ...`).
      shell: bash
      env:
        POSTGRES_PASSWORD: postgres
        POSTGRES_USER: postgres
        POSTGRES_PORT: 55432
        PGPASSWORD: postgres
        REDIS_HOST: localhost
        REDIS_PORT: 56379
        MSSQL_PASSWORD: Protean123!
        MSSQL_USER: sa
        MSSQL_PORT: 51433
        MSSQL_HOST: localhost
        MYSQL_PASSWORD: protean
        MYSQL_USER: root
        MYSQL_PORT: 53306
        MYSQL_HOST: localhost
        MARIADB_PORT: 53307
        MARIADB_HOST: localhost
      run: uv run protean test ${{ inputs.test-args != '' && inputs.test-args || (inputs.full == 'true' && '-c FULL' || '') }}

    # The PR lane's legs each keep their coverage data, and ci.yml's `Coverage`
    # job combines them into one upload. Saved even when tests fail (`-c PR`
    # then leaves the raw `.coverage.*` files uncombined), so partial coverage
    # still reaches Codecov.
    - name: Save coverage data
      if: ${{ !cancelled() && inputs.coverage-artifact != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.coverage-artifact }}
        path: .coverage*
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1

    # Project coverage floor. `protean test -c FULL` already ran `coverage
    # combine`, so the merged `.coverage` exists; re-report it with a hard
    # threshold so a change that drops overall coverage fails. `success() &&`
    # keeps it from running after the Tests step failed (no merged `.coverage`).
    - name: Enforce coverage floor
      if: ${{ success() && inputs.enforce-coverage == 'true' }}
      shell: bash
      run: uv run coverage report --fail-under=94

    # Upload from the FULL leg even when tests fail, so partial coverage is
    # visible; skip only on cancellation. `fail_ci_if_error` makes a rejected
    # upload (missing/invalid token, Codecov outage) fail this leg instead of
    # silently leaving the required `codecov/patch` check unreported.
    - name: CodeCOV
      if: ${{ !cancelled() && inputs.upload-coverage == 'true' }}
      uses: codecov/codecov-action@v7.0.0
      with:
        files: coverage.xml
        token: ${{ inputs.codecov-token }}
        fail_ci_if_error: true
