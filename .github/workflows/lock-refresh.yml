name: Lock refresh

# Once a week, move uv.lock to the newest versions pyproject.toml allows and
# open (or update) one PR with the result.
#
# Dependabot's pip ecosystem edits pyproject.toml only. A widened range leaves
# the locked version in place, because it still fits, so CI keeps testing the
# old release: SQLAlchemy stayed locked on 2.0 after its cap allowed 2.1, and
# the 2.1 driver change went unseen. This workflow is what moves the lock.
# Holds on a dependency (mypy below 3, elasticsearch below 9) live as caps in
# pyproject.toml, because `uv lock --upgrade` does not read Dependabot's ignore
# rules.
#
# Two jobs, so no write credential is ever present where dependency code runs.
# `uv lock --upgrade` can run a new release's build backend to read its
# metadata. The `lock` job does that with a read-only token and no secrets, and
# hands uv.lock over as an artifact. The `publish` job starts from a fresh
# checkout of main, takes only that file, and is the one that holds the token.
#
# A PR opened with the built-in GITHUB_TOKEN does not start CI. Set the
# LOCK_REFRESH_TOKEN secret (a token with contents and pull-requests write on
# this repository) so the PR runs CI on its own. Without it the PR still opens,
# and closing and reopening it starts CI.
on:
  schedule:
    # 05:00 UTC every Monday, ahead of Dependabot's weekly run.
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: lock-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Upgrade uv.lock
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run checks out the ref picked in the Actions UI. Pinning
          # main keeps the PR, which targets main, free of that ref's commits.
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Upgrade the lock
        run: |
          set -o pipefail
          uv lock --upgrade 2>&1 | tee lock.log

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lock-refresh
          path: |
            uv.lock
            lock.log
          retention-days: 1

  publish:
    needs: lock
    if: needs.lock.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Open or update the PR
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: deps/lock-refresh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.LOCK_REFRESH_TOKEN || github.token }}

      - uses: actions/download-artifact@v8
        with:
          name: lock-refresh
          path: ${{ runner.temp }}/lock-refresh

      - name: Commit, push and open the PR
        env:
          GH_TOKEN: ${{ secrets.LOCK_REFRESH_TOKEN || github.token }}
        run: |
          cp "$RUNNER_TEMP/lock-refresh/uv.lock" uv.lock

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add uv.lock
          git commit -m "Refresh uv.lock"
          # The branch holds one generated commit, rebuilt from main each week.
          git push --force origin "$BRANCH"

          {
            echo "Moves \`uv.lock\` to the newest versions \`pyproject.toml\` allows."
            echo "Generated by the lock-refresh workflow; it rebuilds this branch each week."
            echo
            echo '```'
            grep -E '^(Updated|Added|Removed) ' "$RUNNER_TEMP/lock-refresh/lock.log" || true
            echo '```'
          } > "$RUNNER_TEMP/body.md"

          number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Refresh uv.lock" \
              --body-file "$RUNNER_TEMP/body.md" \
              --label dependencies
          fi
