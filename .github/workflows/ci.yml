name: CI

# Protean's CI lanes (a PR, a push to main, nightly):
#
# - A PR runs lint, mypy, the DX pack, CORE on every stable Python, and the
#   `Adapters` job: Postgres and Redis on every PR, plus each adapter the PR
#   touches (tests/adapters.toml). The `Coverage` job combines the CORE 3.14 leg
#   and the adapter legs into one Codecov upload, which `codecov/patch` gates.
# - A push to main or a release branch also runs the full adapter suite on 3.14
#   (`Python 3.14 Full`), uploads its coverage and enforces the project floor.
#   A red run on main opens or updates the `ci-failure` issue.
# - nightly.yml runs the full suite on every Python.
#
# Every required check runs on the PR itself. A `workflow_dispatch` run never
# counts toward a PR's checks, even when it runs on the PR's head commit.
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

# A PR's runs share one group, so a new push cancels the run on the old head.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The CORE legs, on every PR: 3.11 to 3.13 at the locked versions, and
        # 3.14 at the dependency floor (lowest-direct), which proves the floors
        # resolve and install on the newest stable Python. On a PR the 3.14
        # leg runs CORE under coverage (`-c PR --no-adapters`) and saves the
        # data for the `Coverage` job.
        #
        # A push to main or a release branch adds `Python 3.14 Full`: the whole
        # adapter suite (`-c FULL`, with Postgres, Redis, Elasticsearch, MSSQL,
        # MySQL, MariaDB and MessageDB). It is the only leg that sees every
        # adapter, so it alone uploads main's coverage and enforces the 94%
        # project floor. The full suite on 3.11 to 3.13 runs nightly
        # (nightly.yml). See ADR-0020.
        #
        # 3.15 (prerelease) does NOT run here. The ecosystem ships no cp315
        # wheels yet, so a 3.15 leg builds its native-extension dependencies
        # (grpcio, pydantic-core, psycopg2, pyodbc, and more) from source on every
        # run, which dominates the job. nightly.yml runs 3.15 with the full adapter
        # suite and files an issue on failure, the right cadence for a non-blocking
        # prerelease canary. Add a per-PR 3.15 CORE leg here once cp315 wheels land
        # and the build is fast; move the FULL/lowest-direct roles to it once 3.15
        # is the newest stable. The floor leg stays on 3.14: the floors are pinned
        # to first-cp314-wheel versions and need not have a cp315 wheel yet.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"python-version":"3.11","full":false,"resolution":"highest"},{"python-version":"3.12","full":false,"resolution":"highest"},{"python-version":"3.13","full":false,"resolution":"highest"},{"python-version":"3.14","full":false,"resolution":"lowest-direct","pr-coverage":true}]' || '[{"python-version":"3.11","full":false,"resolution":"highest"},{"python-version":"3.12","full":false,"resolution":"highest"},{"python-version":"3.13","full":false,"resolution":"highest"},{"python-version":"3.14","full":true,"resolution":"highest"},{"python-version":"3.14","full":false,"resolution":"lowest-direct"}]') }}
    # Check names are branch-protection contexts. The CORE legs and the
    # lowest-direct leg on 3.14 are `Python X Tests`; the full adapter leg on a
    # push is `Python 3.14 Full`.
    name: ${{ matrix.full && 'Python 3.14 Full' || format('Python {0} Tests', matrix.python-version) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/test-suite
        with:
          python-version: ${{ matrix.python-version }}
          full: ${{ matrix.full }}
          resolution: ${{ matrix.resolution }}
          test-args: ${{ matrix.pr-coverage && '-c PR --no-adapters' || '' }}
          coverage-artifact: ${{ matrix.pr-coverage && 'coverage-core' || '' }}
          # Only the full adapter leg (on a push) sees every adapter, so only it
          # enforces the project floor and uploads main's coverage.
          enforce-coverage: ${{ matrix.full }}
          upload-coverage: ${{ matrix.full }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  # Picks the PR's adapter legs from tests/adapters.toml and the files the PR
  # changed: every `pr` adapter, plus each `touched` adapter whose paths changed.
  adapter-select:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Select adapters
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      # A PR run checks out the PR's merge commit. Depth 2 brings its first
      # parent, the base branch tip, so the diff between them is the PR's change.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: List the files the PR changed
        run: |
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed-files.txt"
          cat "$RUNNER_TEMP/changed-files.txt"

      - name: Build the adapter matrix
        id: select
        run: |
          uv sync
          matrix="$(uv run protean test select-adapters "$RUNNER_TEMP/changed-files.txt")"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # One leg per adapter group, on 3.14. A leg the PR does not need is left out
  # of the matrix, never skipped with `if:`: GitHub counts a skipped job as
  # passing a required check.
  adapters:
    needs: adapter-select
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.adapter-select.outputs.matrix) }}
    name: Adapter ${{ matrix.leg }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/test-suite
        with:
          python-version: "3.14"
          services: ${{ matrix.services }}
          test-args: ${{ matrix.test-args }}
          coverage-artifact: coverage-adapter-${{ matrix.leg }}

  # The required check for the adapter legs. It always reports on a PR, and
  # fails unless the selection and every leg passed, so the set of legs can
  # change from PR to PR without changing branch protection.
  adapters-gate:
    needs: [adapter-select, adapters]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Adapters
    steps:
      - name: Check the adapter legs
        env:
          SELECT: ${{ needs.adapter-select.result }}
          LEGS: ${{ needs.adapters.result }}
        run: |
          echo "Select adapters: $SELECT, adapter legs: $LEGS"
          [ "$SELECT" = "success" ] && [ "$LEGS" = "success" ]

  # Combines the CORE 3.14 leg's coverage with every adapter leg's and uploads
  # it once. One upload means Codecov never computes `codecov/patch` on a
  # partial report. Runs when a leg failed too, so partial coverage is visible.
  coverage:
    needs: [test, adapters]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Coverage
    steps:
      # The source is needed to write coverage.xml.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: ${{ runner.temp }}/coverage

      - name: Combine coverage
        run: |
          find "$RUNNER_TEMP/coverage" -type f -name '.coverage*' | sort > "$RUNNER_TEMP/coverage-files.txt"
          cat "$RUNNER_TEMP/coverage-files.txt"
          xargs uv run --only-group test coverage combine < "$RUNNER_TEMP/coverage-files.txt"
          uv run --only-group test coverage xml
          uv run --only-group test coverage report | tail -1

      # `fail_ci_if_error` makes a rejected upload (missing/invalid token,
      # Codecov outage) fail this job instead of silently leaving the required
      # `codecov/patch` check unreported.
      - name: CodeCOV
        uses: codecov/codecov-action@v7.0.0
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # A red push to main opens or updates the `ci-failure` issue, the same one
  # the nightly run uses.
  report-main-failure:
    needs: [test, mypy, lint, dx-pack, docs-deploy]
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Report main failure
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/report-ci-failure
        with:
          run-name: CI on main
          details: >-
            A job in the push-to-main run went red. It is the only per-commit run
            of the full adapter suite and the project coverage floor, so a
            failure here was not caught on the PR.

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Mypy (src/protean)
    # Static type gate. src/protean must pass mypy with the quarantine config in
    # pyproject.toml — a clean run is green and NEW errors outside the quarantine
    # fail CI. The quarantine shrinks per type-safety sub-issue (see ADR-0018).
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Mypy
        run: uv run mypy src/protean

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Lint (ruff)
    # Fast, service-free quality gate. Runs the same ruff lint + format checks
    # as the pre-commit hook, but in CI where they can't be bypassed (hooks not
    # installed, `--no-verify`, web edits, bot commits). Format is verified with
    # `--check`, never applied. Uses the ruff pinned in uv.lock so CI and local
    # runs stay on the same version.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Ruff only reads source files and its pyproject config; it does not import
      # protean, so the default sync (project + dev group, no adapter extras) is
      # all it needs and keeps this job fast.
      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

  dx-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: DX pack (clean install)
    # Builds the wheel and installs it into a clean virtualenv that cannot see
    # the source tree, then asserts the DX pack (src/protean/dx/pack) shipped as
    # package data and is readable through the importlib.resources accessor. The
    # unit suite reads the pack from the source tree; only a clean-install check
    # proves the data survived the build into the wheel. Hatchling ships the pack
    # with no build-config change (its packages target includes every file under
    # src/protean), so this job guards against silent loss of that data: an
    # uncommitted, deleted, or moved file.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build wheel
        run: uv build --wheel

      - name: Install the wheel into a clean venv and read the pack
        # `python -` reads the check from stdin, so sys.path[0] is the repo root,
        # which has no top-level `protean` package to shadow the installed wheel.
        run: |
          python -m venv /tmp/pack-venv
          /tmp/pack-venv/bin/pip install --upgrade pip
          /tmp/pack-venv/bin/pip install dist/*.whl
          # Explicit raises, not asserts: `python -O` would strip asserts, and a
          # guard whose job is to fail loudly must not be optimizable away. The
          # SKILL.md check covers every shipped skill, not just the first.
          /tmp/pack-venv/bin/python - <<'PY'
          import protean
          from protean import dx

          if dx.PACK_VERSION != protean.__version__: raise SystemExit("PACK_VERSION drifted from the framework version")

          agents = dx.load_agents_source()
          if not agents.strip(): raise SystemExit("AGENTS.md source is empty")

          skills = dx.iter_skills()
          if not skills: raise SystemExit("no skills shipped in the DX pack")

          empty = [name for name in skills if not dx.read_pack_text(dx.SKILLS_DIR, name, dx.SKILL_FILE).strip()]
          if empty: raise SystemExit(f"skills with an empty SKILL.md: {empty}")

          print(f"DX pack OK: version={dx.PACK_VERSION}, skills={skills}")
          PY

      - name: Round-trip `protean dx` install and check from the wheel
        # Prove the `dx` command works end to end from the built wheel, not just
        # from the source tree: a fresh project reports drift, and after
        # `dx install` the same `dx check` is clean. This is the `check` CI gate
        # exercised against the artifact that ships.
        run: |
          set -e
          proj="$(mktemp -d)"
          # A project that was never installed has drifted, so check must report
          # exactly the drift exit code (1), not an environment error (2).
          status=0
          /tmp/pack-venv/bin/protean dx check -p "$proj" || status=$?
          if [ "$status" -ne 1 ]; then
            echo "expected dx check to report drift (exit 1) on a fresh project, got $status"
            exit 1
          fi
          # After install, check must be clean (exit 0).
          /tmp/pack-venv/bin/protean dx install -p "$proj"
          /tmp/pack-venv/bin/protean dx check -p "$proj"
          echo "dx round-trip OK"

  # Publishes the docs via the GitHub Actions Pages pipeline (build the site,
  # then deploy the artifact) instead of `mkdocs gh-deploy` to the gh-pages
  # branch. The legacy branch-based Pages builder proved unreliable (builds
  # intermittently stuck/errored), freezing the live site on a stale snapshot;
  # the Actions deployment removes that GitHub-side build step entirely.
  #
  # Not gated on `test`: the rendered docs don't depend on the DB integration
  # matrix, and gating publication on a 30-min (occasionally flaky) suite means
  # a single flake strands the docs. Runs on main only.
  docs-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Serialize Pages deployments; never cancel one mid-publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: uv sync --group docs --no-dev

      - name: Build site
        run: uv run mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
