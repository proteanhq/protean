name: Nightly

# The full `-c FULL` adapter suite across every supported Python. Per-PR CI runs
# only Postgres, Redis and the adapters a PR touches, and a push to main runs
# the full suite on the newest Python only (ci.yml); this
# nightly run is where a version-specific adapter regression on 3.11-3.13 (or a
# floor that only breaks against a real service) is caught. On failure the
# `notify` job opens or updates the `ci-failure` issue it shares with the
# push-to-main run in ci.yml.
on:
  schedule:
    # 06:00 UTC daily. Adjust freely; scheduled runs only fire on the default branch.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The prerelease leg (3.15) is allowed to fail without failing the run or
    # tripping the notify job below; it depends on upstream cp315 wheels that are
    # outside Protean's control. Stable legs leave `experimental` unset and gate
    # normally.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.11", resolution: highest }
          - { python-version: "3.12", resolution: highest }
          - { python-version: "3.13", resolution: highest }
          - { python-version: "3.14", resolution: highest }
          # Adapter floors against real services, on the newest stable Python.
          - { python-version: "3.14", resolution: lowest-direct }
          # Prerelease: run the full adapter suite on 3.15, non-blocking.
          - { python-version: "3.15", resolution: highest, experimental: true }
    name: ${{ matrix.resolution == 'lowest-direct' && format('Python {0} Full (lowest-direct)', matrix.python-version) || format('Python {0} Full', matrix.python-version) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/test-suite
        with:
          python-version: ${{ matrix.python-version }}
          full: true
          resolution: ${{ matrix.resolution }}

  notify:
    name: Report nightly failure
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/report-ci-failure
        with:
          run-name: Nightly CI
          details: >-
            A `Python X Full` leg went red. This catches adapter regressions on
            the Python versions that per-PR CI exercises in-memory only, and
            floors that only break against a real service.
