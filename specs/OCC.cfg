\* Shipped protocol: the version check is atomic with the write (a single
\* compare-and-set). Two writers contend for one aggregate, both can read the
\* same base, and exactly one per base wins while the rest conflict. Every
\* invariant holds and every writer eventually reaches a terminal state.
SPECIFICATION FairSpec
\* Writers legitimately reach a terminal state (committed/conflicted) and stop;
\* that is quiescence, not a stall. EventuallyResolved catches a real stall.
CHECK_DEADLOCK FALSE
CONSTANTS
    Writers = {w1, w2}
    Atomic = TRUE
INVARIANT TypeOK
INVARIANT NoLostUpdate
INVARIANT AtMostOneWinnerPerBase
INVARIANT VersionMonotonic
INVARIANT ConflictImpliesStale
PROPERTY EventuallyResolved
