\* Revert test. GapSafe = FALSE restores the gap-skip bug (ADR-0025): advance the
\* cursor to the highest position seen. TLC MUST report a counterexample, a
\* committed position stepped over silently, for NoSkip (listed first so it is
\* the reported one) and equally for NoSilentSkip. If this run ever passes, the
\* model has lost its teeth.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    N = 3
    GapSafe = FALSE
    AbandonScope = "holes"
    MaxCrashes = 0
INVARIANT NoSkip
INVARIANT NoSilentSkip
INVARIANT TypeOK
INVARIANT DurableBehindCursor
INVARIANT DeliveredAreVisible
INVARIANT VisibleAreCommitted
