\* Shipped fix (ADR-0025), operated within its stated regime: a gap timer only
\* fires on a genuine hole (gap_timeout_seconds >= commit latency). All
\* invariants hold and every committed position is eventually delivered.
SPECIFICATION FairSpec
\* These protocols legitimately quiesce (e.g. every position rolled back), which
\* is a terminal state, not a stall. Deadlock checking is off; the liveness
\* property AllCommittedDelivered is what catches a genuine permanent stall.
CHECK_DEADLOCK FALSE
CONSTANTS
    N = 4
    GapSafe = TRUE
    AbandonScope = "holes"
    MaxCrashes = 1
INVARIANT TypeOK
INVARIANT NoSkip
INVARIANT NoSilentSkip
INVARIANT DurableBehindCursor
INVARIANT DeliveredAreVisible
INVARIANT VisibleAreCommitted
PROPERTY AllCommittedDelivered
