\* Coverage: a green conformance run means nothing unless the log actually
\* exercised an out-of-order gap. CoverGap asserts "the settled watermark always
\* reaches the frontier"; TLC must find a counterexample, which witnesses that the
\* recorded log stranded a visible position above the watermark behind a lower gap.
\* An in-order log never strands one, leaves CoverGap holding (TLC finds no error),
\* and check.sh rejects it as under-covered. See specs/CheckpointTrace.tla.
SPECIFICATION TSpec
CHECK_DEADLOCK FALSE
CONSTANT N <- TraceN
CONSTANT GapSafe = TRUE
CONSTANT AbandonScope = "holes"
CONSTANT MaxCrashes = 0
CONSTANT Trace <- TraceDef
CONSTANT Fate <- TraceFate
INVARIANT CoverGap
