\* Revert test for the claim contract (ADR-0013). ClaimSafe = FALSE drops the
\* lock and holder guards, modeling a claim that fails to exclude other workers.
\* With two workers and one message, TLC MUST report NoDoubleActiveClaim
\* violated: both workers grab the same row. This is what gives the
\* no-double-claim invariant teeth, since with the guard it holds by
\* construction and could never fail.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Messages = {1}
    Workers = {w1, w2}
    MaxRetries = 2
    MaxCrashes = 0
    AckBeforePublish = FALSE
    ClaimSafe = FALSE
INVARIANT NoDoubleActiveClaim
