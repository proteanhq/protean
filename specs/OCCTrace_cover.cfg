\* Coverage: a green conformance run means nothing unless the log actually
\* exercised contention. NoConflict (imported from OCC.tla, the same reachability
\* probe OCC_conflict.cfg uses) asserts "no writer ever conflicts"; TLC must find a
\* counterexample, which witnesses that the recorded log contains a real conflict. A
\* log with no conflict leaves NoConflict holding (TLC finds no error), and check.sh
\* rejects it as under-covered. See specs/OCCTrace.tla.
SPECIFICATION TSpec
CHECK_DEADLOCK FALSE
CONSTANT Trace <- TraceDef
CONSTANT Writers <- TraceWriters
CONSTANT Atomic = TRUE
INVARIANT NoConflict
