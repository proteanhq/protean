\* Conflict-reachability probe (shipped protocol). The whole model is only
\* meaningful if two writers can genuinely race from the same base and one is
\* forced to conflict; a model where they never contend would satisfy
\* NoLostUpdate vacuously and the revert test would prove nothing. This asserts
\* the NEGATION, "no writer ever conflicts", so TLC's counterexample is a
\* concrete witness that the contention is real: both writers read base 0, one
\* commits and advances the version to 1, and the other's compare-and-set is
\* rejected with a conflict. Like the _bug config, a passing run here would mean
\* the model failed to exhibit the behavior it should.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Writers = {w1, w2}
    Atomic = TRUE
INVARIANT NoConflict
