\* Reachability probe (shipped fix). Asserts "no position is ever redelivered"
\* so TLC's counterexample is a concrete witness that a crash-resume redelivers
\* an already-handled position: the checkpoint side of at-least-once. Handlers
\* must tolerate it. Like the _bug configs, a passing run here would mean the
\* model failed to exhibit the behavior it should.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    N = 3
    GapSafe = TRUE
    AbandonScope = "holes"
    MaxCrashes = 1
INVARIANT NoRedelivery
