\* Conformance: the recorded log is a behaviour Checkpoint.tla permits. Run against
\* a generated CheckpointTrace_run.tla, which defines TraceDef (the transitions),
\* TraceN (the highest recorded position), and TraceFate (each position's recorded
\* commit/rollback fate). TraceAccepted holds iff the read pointer reaches the end
\* of the log, i.e. every recorded step matched a Checkpoint action. A seeded
\* gap-skip divergence stalls the replay and violates TraceAccepted. See
\* specs/CheckpointTrace.tla.
SPECIFICATION TSpec
CHECK_DEADLOCK FALSE
CONSTANT N <- TraceN
CONSTANT GapSafe = TRUE
CONSTANT AbandonScope = "holes"
CONSTANT MaxCrashes = 0
CONSTANT Trace <- TraceDef
CONSTANT Fate <- TraceFate
INVARIANT TypeOK
INVARIANT NoSilentSkip
PROPERTY TraceAccepted
