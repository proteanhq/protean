\* Conformance: the recorded log is a behaviour Recovery.tla permits. Run against a
\* generated RecoveryTrace_run.tla, which defines TraceDef (the log), NDef (the
\* highest position), and MaxCrashesDef (the crash count). TraceAccepted holds iff
\* the read pointer reaches the end of the log, i.e. every recorded step matched a
\* Recovery action. A seeded advance-without-record stalls the replay (Advance is
\* gated on the durable record under RecordFirst = TRUE) and violates TraceAccepted.
\* See specs/RecoveryTrace.tla.
SPECIFICATION TSpec
CHECK_DEADLOCK FALSE
CONSTANT Trace <- TraceDef
CONSTANT N <- NDef
CONSTANT MaxCrashes <- MaxCrashesDef
CONSTANT RecordFirst = TRUE
INVARIANT TypeOK
INVARIANT NoDrop
INVARIANT DurableBehindCursor
PROPERTY TraceAccepted
