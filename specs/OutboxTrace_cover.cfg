\* Coverage: a green conformance run means nothing unless the log actually witnessed
\* the at-least-once redelivery — a crash after the broker publish but before the
\* mark, then a reclaim and republish. NoDuplicateDelivery (imported from Outbox.tla,
\* the same reachability probe Outbox_dup.cfg uses) asserts "no message is ever
\* delivered twice"; TLC must find a counterexample, which witnesses that the
\* recorded log re-published a message after a crash. A log with no such redelivery
\* leaves NoDuplicateDelivery holding (TLC finds no error), and check.sh rejects it as
\* under-covered. See specs/OutboxTrace.tla.
SPECIFICATION TSpec
CHECK_DEADLOCK FALSE
CONSTANT Trace <- TraceDef
CONSTANT Messages <- MessagesDef
CONSTANT Workers <- WorkersDef
CONSTANT MaxRetries <- MaxRetriesDef
CONSTANT MaxCrashes <- MaxCrashesDef
CONSTANT AckBeforePublish = FALSE
CONSTANT ClaimSafe = TRUE
INVARIANT NoDuplicateDelivery
