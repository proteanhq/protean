\* Revert test. Atomic = FALSE splits the commit into a compare step and a later
\* unconditional write, the read-compare-write race of ADR-0013. TLC MUST
\* report a counterexample for NoLostUpdate: both writers read base 0, both pass
\* the compare, both write version 1, so two commits succeed but the stored
\* version only reaches 1 and one update is silently dropped. The two model-trust
\* invariants still hold under the split (the version still increments by one and
\* never rolls back), so NoLostUpdate is the only violation. If this run ever
\* passes, the model has lost its teeth.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Writers = {w1, w2}
    Atomic = FALSE
INVARIANT TypeOK
INVARIANT NoLostUpdate
INVARIANT VersionMonotonic
INVARIANT ConflictImpliesStale
