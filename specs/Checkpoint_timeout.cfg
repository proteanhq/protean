\* The documented trade-off. AbandonScope = "all" lets a gap age out even on a
\* genuine (but slow) commit, i.e. gap_timeout_seconds shorter than commit
\* latency. The strong guarantee NoSkip can then fail (a slow commit is dropped),
\* but the drop is never SILENT: NoSilentSkip still holds because the cursor only
\* steps past a gap by recording it in `abandoned` (the code logs it). This is
\* exactly guarantees.md: "a genuinely slow commit (> gap_timeout_seconds) is
\* logged and dropped." NoSkip is intentionally NOT asserted here; see README.md.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    N = 3
    GapSafe = TRUE
    AbandonScope = "all"
    MaxCrashes = 0
INVARIANT TypeOK
INVARIANT NoSilentSkip
INVARIANT DurableBehindCursor
INVARIANT DeliveredAreVisible
INVARIANT VisibleAreCommitted
