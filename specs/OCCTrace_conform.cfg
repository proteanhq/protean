\* Conformance: the recorded log is a behaviour OCC.tla permits. Run against a
\* generated OCCTrace_run.tla, which defines TraceDef (the log) and TraceWriters
\* (its writers). TraceAccepted holds iff the read pointer reaches the end of the
\* log, i.e. every recorded step matched an OCC!Commit verdict. A seeded divergence
\* stalls the replay and violates TraceAccepted. See specs/OCCTrace.tla.
SPECIFICATION TSpec
CHECK_DEADLOCK FALSE
CONSTANT Trace <- TraceDef
CONSTANT Writers <- TraceWriters
CONSTANT Atomic = TRUE
INVARIANT TypeOK
INVARIANT NoLostUpdate
PROPERTY TraceAccepted
