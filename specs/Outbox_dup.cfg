\* Duplicate-reachability probe (shipped ordering). At-least-once delivery means
\* a message can reach the broker more than once (a crash after the publish but
\* before the mark, then a reclaim and republish), and handlers must tolerate it.
\* This asserts the NEGATION, "no message is ever delivered twice", so TLC's
\* counterexample is a concrete witness that the duplicate window is real, not
\* merely assumed. Like the _bug configs, a passing run here would mean the model
\* failed to exhibit the behavior it should.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Messages = {1}
    Workers = {w1, w2}
    MaxRetries = 3
    MaxCrashes = 1
    AckBeforePublish = FALSE
    ClaimSafe = TRUE
INVARIANT NoDuplicateDelivery
