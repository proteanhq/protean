\* Coverage: a green conformance run means nothing unless the log actually
\* witnessed the redelivery from a crash after the record but before the durable
\* flush, the window the protocol exists for. NoRedeliver (imported from
\* Recovery.tla, the same probe Recovery_dup.cfg
\* uses) asserts "no failed message is ever re-read after a crash"; TLC must find a
\* counterexample, which witnesses that the recorded log re-read an already-recorded
\* failed position after a crash. A log with no such crash leaves NoRedeliver
\* holding (TLC finds no error), and check.sh rejects it as under-covered. See
\* specs/RecoveryTrace.tla.
SPECIFICATION TSpec
CHECK_DEADLOCK FALSE
CONSTANT Trace <- TraceDef
CONSTANT N <- NDef
CONSTANT MaxCrashes <- MaxCrashesDef
CONSTANT RecordFirst = TRUE
INVARIANT NoRedeliver
