\* Shipped ordering: publish to the broker, THEN mark the row, with a claim that
\* excludes other workers. Two workers contend for the same messages, locks
\* expire, a worker can crash mid-flight, and publishes can fail. Every invariant
\* holds and every message eventually reaches a terminal state.
SPECIFICATION FairSpec
\* Messages legitimately reach a terminal state (PUBLISHED/ABANDONED) and stop;
\* that is quiescence, not a stall. EventuallyResolved catches a real stall.
CHECK_DEADLOCK FALSE
CONSTANTS
    Messages = {1, 2}
    Workers = {w1, w2}
    MaxRetries = 2
    MaxCrashes = 1
    AckBeforePublish = FALSE
    ClaimSafe = TRUE
INVARIANT TypeOK
INVARIANT PublishedImpliesDelivered
INVARIANT NoDoubleActiveClaim
INVARIANT AbandonedAfterRetries
INVARIANT LockImpliesProcessing
INVARIANT WorkerStateAgree
INVARIANT DuplicatedArePublished
PROPERTY EventuallyResolved
