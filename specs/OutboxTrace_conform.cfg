\* Conformance: the recorded log is a behaviour Outbox.tla permits. Run against a
\* generated OutboxTrace_run.tla, which defines TraceDef (the log), MessagesDef and
\* WorkersDef (the id sets), and MaxRetriesDef / MaxCrashesDef (the bounds).
\* TraceAccepted holds iff the read pointer reaches the end of the log, i.e. every
\* recorded step matched an Outbox action. A seeded mark-without-publish stalls the
\* replay (MarkPublished is gated on phase = "pubok") and violates TraceAccepted. The
\* shipped constants are bound (AckBeforePublish = FALSE, ClaimSafe = TRUE), so the
\* replay uses the shipped actions, not the bug actions. See specs/OutboxTrace.tla.
SPECIFICATION TSpec
CHECK_DEADLOCK FALSE
CONSTANT Trace <- TraceDef
CONSTANT Messages <- MessagesDef
CONSTANT Workers <- WorkersDef
CONSTANT MaxRetries <- MaxRetriesDef
CONSTANT MaxCrashes <- MaxCrashesDef
CONSTANT AckBeforePublish = FALSE
CONSTANT ClaimSafe = TRUE
INVARIANT TypeOK
INVARIANT PublishedImpliesDelivered
INVARIANT NoDoubleActiveClaim
INVARIANT AbandonedAfterRetries
INVARIANT LockImpliesProcessing
PROPERTY TraceAccepted
