\* Revert test. AckBeforePublish = TRUE marks the row PUBLISHED before the broker
\* publish. TLC MUST report a counterexample for PublishedImpliesDelivered: a row
\* whose durable state claims a delivery the broker never received. A crash in
\* that window makes the loss permanent. If this run ever passes, the model has
\* lost its teeth.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Messages = {1}
    Workers = {w1}
    MaxRetries = 2
    MaxCrashes = 1
    AckBeforePublish = TRUE
    ClaimSafe = TRUE
INVARIANT PublishedImpliesDelivered
INVARIANT TypeOK
INVARIANT NoDoubleActiveClaim
INVARIANT AbandonedAfterRetries
INVARIANT LockImpliesProcessing
INVARIANT WorkerStateAgree
INVARIANT DuplicatedArePublished
