[tool.bumpversion]
current_version = "0.16.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []

# The global `search = "{current_version}"` above is unanchored and replaces
# every match in a file. That is what is wanted for the files below whose only
# matches ARE version references, and it is a trap for any file that also
# mentions the same version for another reason: on the 0.17.0 bump it rewrote
# `"typer>=0.16.0"` to `"typer>=0.17.0"`, ratcheting a dependency floor once per
# release inside the tagged commit.
#
# Files with a match that is not a version reference anchor their own search.
# `tests/test_version_bump_touches_only_versions.py` checks that the ones which
# do not have stayed safe, so the next `typer` fails the suite rather than the
# release.
[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/protean/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/protean/template/domain_template/pyproject.toml.jinja"

[[tool.bumpversion.files]]
filename = "docs/guides/getting-started/installation.md"
