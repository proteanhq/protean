; Strict mypy config for the typed-dispatch fixture run.
; Explicitly passed via --config-file so this test does NOT inherit the
; project's pyproject [tool.mypy] (quarantine, module overrides, etc.). It
; runs the plugin under strict mode to prove typed dispatch resolves the
; declared result type with no errors even at the strictest setting.
[mypy]
plugins = protean.ext.mypy_plugin
strict = true
