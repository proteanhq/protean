repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^uv\.lock$
      # complexipy rewrites its snapshot on every passing run, without a final
      # newline.
      - id: end-of-file-fixer
        exclude: ^(uv\.lock|complexipy-snapshot\.json)$
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: ["--fix"]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.17
    hooks:
      - id: uv-lock

  # complexipy checks every path in [tool.complexipy] on every commit, the same
  # run as CI. A commit that changes only the snapshot or the config still
  # needs the check.
  - repo: local
    hooks:
      - id: complexipy
        name: complexipy (cognitive complexity)
        entry: uv run complexipy --failed --color no
        language: system
        always_run: true
        pass_filenames: false
